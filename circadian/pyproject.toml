[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circadian"
version = "0.1.0"
description = "A from-scratch circadian rhythm phase-shift engine: a base oscillator plus additive, pluggable stimulus modules (light, melatonin, exercise, imposed sleep/wake schedules, ...), with an arbitrary multi-segment schedule timeline and an optional full nonlinear fallback model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
authors = [{ name = "jetlag project" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "ruff>=0.4",
]
plot = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
circadian = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
